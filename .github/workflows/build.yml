name: Build LightningHub

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unpack project
        run: unzip -q LightningHub-source.zip

      - name: Build mod
        working-directory: LightningHub
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Publish jar as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            LightningHub/build/libs/lightninghub-1.0.0.jar \
            --title "LightningHub build ${{ github.run_number }}" \
            --notes "Готовый мод: lightninghub-1.0.0.jar"
